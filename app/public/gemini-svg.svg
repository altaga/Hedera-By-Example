<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente sutil de fondo oscuro -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181D" />
      <stop offset="100%" stop-color="#0D0E11" />
    </linearGradient>

    <!-- Gradiente barra izquierda (Violeta) -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Gradiente barra derecha (Cian) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00C8FF" />
    </linearGradient>

    <!-- Filtro de resplandor sutil -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Contenedor Squircle (Estilo App Icon / Industrial) -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" stroke="#2A2E37" stroke-width="3" />

  <!-- Barra Vertical Izquierda (Violeta) -->
  <rect x="148" y="126" width="44" height="260" rx="22" ry="22" fill="url(#purpleGrad)" />

  <!-- Barra Vertical Derecha (Cian) -->
  <rect x="320" y="126" width="44" height="260" rx="22" ry="22" fill="url(#cyanGrad)" />

  <!-- Símbolo Terminal (>_ ) con efecto doble capa limpio -->
  <g transform="translate(0, 4)">
    <!-- Capa base Cian -->
    <path d="M 222 216 L 262 256 L 222 296" fill="none" stroke="#00E5FF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="274" y1="296" x2="298" y2="296" stroke="#00E5FF" stroke-width="20" stroke-linecap="round" />

    <!-- Núcleo interior Blanco/Plata (recreando el detalle de tu imagen con precisión) -->
    <path d="M 222 216 L 262 256 L 222 296" fill="none" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="274" y1="296" x2="298" y2="296" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>